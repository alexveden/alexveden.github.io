{% assign og_image = page.cover | default: 'assets/img/avatar.jpg' %}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

{% if page.url == "/" %}
    <title>{{ site.title | escape }}</title>
{% else %}
    <title>{{ page.title | escape }} · {{ site.longtitle | escape }}</title>
{% endif %}

<meta name="description" content="{{ page.description | default: site.description | strip_newlines | strip | escape }}">
<meta name="author" content="{{ site.author | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">

<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.longtitle | escape }}">
<meta property="og:title" content="{% if page.url == '/' %}{{ site.title | escape }}{% else %}{{ page.title | escape }}{% endif %}">
<meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | strip | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ og_image | absolute_url }}">

<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{% if page.url == '/' %}{{ site.title | escape }}{% else %}{{ page.title | escape }}{% endif %}">
<meta name="twitter:description" content="{{ page.description | default: site.description | strip_newlines | strip | escape }}">
<meta name="twitter:image" content="{{ og_image | absolute_url }}">

<link rel="icon" href="{{ site.favicon_path | relative_url }}" type="image/x-icon">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
