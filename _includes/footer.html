<footer class="site-footer">
    <div class="wrap footer-inner">
        <p class="footer-meta">&copy; {{ site.time | date: '%Y' }} {{ site.author | escape }}</p>
        <ul class="footer-links">
            <li><a href="mailto:{{ site.email }}">{{ site.email }}</a></li>
            <li><a href="https://github.com/{{ site.github_username }}" rel="me">GitHub</a></li>
            <li><a href="https://www.linkedin.com/in/{{ site.linkedin_username }}/" rel="me">LinkedIn</a></li>
        </ul>
    </div>
</footer>
